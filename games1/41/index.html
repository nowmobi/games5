<script>
    function handleScreenOrientation() {
        const orientationDiv = document.getElementById('orientation');
    
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|phone|tablet|Android|iOS/i.test(navigator.userAgent) || 
                        (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);
        
        if (!isMobile) {
            orientationDiv.style.display = 'none';
            return;
        }
        
        function checkOrientation() {
            const aspectRatio = window.innerWidth / window.innerHeight;
            
            if (aspectRatio < 1) {
                orientationDiv.style.display = 'flex';
            } else {
                orientationDiv.style.display = 'none';
            }
        }
        
        checkOrientation();
        
        window.addEventListener('resize', checkOrientation);
        
        if (window.DeviceOrientationEvent) {
            window.addEventListener('orientationchange', function() {
                setTimeout(checkOrientation, 100);
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', handleScreenOrientation);
    } else {
        handleScreenOrientation();
    }
</script>
