<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#000000" />
  <g transform="translate(200, 400)">
    <!-- Rotated phone in portrait orientation -->
    <g transform="rotate(90)">
      <!-- Phone body -->
      <rect x="-60" y="-100" width="120" height="200" rx="20" ry="20" fill="#ffffff" stroke="#ffffff" stroke-width="5"/>
      <!-- Phone top notch or camera -->
      <rect x="-30" y="85" width="60" height="10" rx="5" ry="5" fill="#000000" />
      <!-- Camera circle -->
      <circle cx="0" cy="-80" r="8" fill="#000000" />
    </g>
    <!-- Rotate arrow -->
    <path d="M -80 -30 A 80 80 0 1 0 80 -30" fill="none" stroke="white" stroke-width="5" transform="rotate(-45 0 0)" />
    <polygon points="70,-40 90,-30 70,-20" fill="white" />
    <!-- Text -->
    <text x="0" y="150" text-anchor="middle" fill="white" font-size="24" font-family="Arial" font-weight="bold">Rotate to landscape</text>
  </g>
</svg>