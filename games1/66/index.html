                event =  new Event(name);
            }else{
                event = document.createEvent('Event');
                event.initEvent(name, true, true);
            }
            document.getElementById("content").dispatchEvent(event);
        }

<script type="text/javascript">
    // Check if device orientation is supported
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // For iOS 13+ devices that require permission to access device orientation
        DeviceOrientationEvent.requestPermission()
            .then(function (permissionState) {
                if (permissionState === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation, false);
                }
            })
            .catch(console.error);
    } else {
        // For other devices that support device orientation
        window.addEventListener('deviceorientation', handleOrientation, false);
    }

    // Add event listener for resize to detect orientation change
    window.addEventListener('resize', checkOrientation, false);
    window.addEventListener('load', checkOrientation, false);

    function checkOrientation() {
        var orientationDiv = document.getElementById('orientation');
        
        // Check if the device is in portrait mode (window height is greater than width)
        if (window.innerHeight > window.innerWidth) {
            // Portrait mode detected, show orientation message and add rotate class
            orientationDiv.style.display = 'flex';
            orientationDiv.classList.add('rotate');
        } else {
            // Landscape mode, remove rotate class to stop animation but keep the phone icon in landscape position
            orientationDiv.classList.remove('rotate');
        }
    }

    function handleOrientation() {
        // This function handles device orientation events
        checkOrientation();
    }
</script>
