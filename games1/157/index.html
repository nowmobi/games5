<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui, shrink-to-fit=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">

    
    <title>Wheely 3 Unblocked GameDistribution</title>
    

    <link rel="stylesheet" href="assets/css/app.css" type="text/css" />

    <style>
        #orientation {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .phone-icon {
            width: 80px;
            height: 150px;
            border: 4px solid #fff;
            border-radius: 16px;
            position: relative;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50% auto;
        }

        .phone-icon::before {
            content: '';
            position: absolute;
            top: -20px;
            width: 40px;
            height: 6px;
            background: #fff;
            border-radius: 4px;
        }

        .phone-icon::after {
            content: '';
            position: absolute;
            bottom: 15px;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
        }

        .phone-rotate-animation {
            animation: rotatePhone 1.5s infinite linear;
        }

        @keyframes rotatePhone {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(90deg);
            }
        }
        
    </style>


    <script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, false);
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
		
        function checkOrientation() {
            var orientationDiv = document.getElementById('orientation');
            if (window.innerHeight > window.innerWidth) {
                orientationDiv.style.display = 'flex';
            } else {
                orientationDiv.style.display = 'none';
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();
    </script>
</head>
<body style="overflow:hidden;">
<div id="content"></div>
<div id="orientation">
    <div class="phone-icon phone-rotate-animation"></div>
</div>
<div id="loader">Loading ...</div>
<script type="text/javascript">


    
    var gameName = "wheely-3.min.js";
    

    
    
        

        //This all here is for cache busting;
        function addScript(src, buster, callback) {
            var s = document.createElement('script');
            s.setAttribute('src', src + '?v=' + buster);
            if (typeof callback === 'function') {
                s.onload = callback;
            }
            document.body.appendChild(s);
        }

    
    addScript('version.js', Date.now(), function () {
        
        addScript(gameName, version, function () {
            var game = new Wheely.Client.Main();
        });
        
    });
    
</script>
