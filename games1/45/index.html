<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <link rel="stylesheet" href="css/app.css" type="text/css" />
    <meta property="og:image" content="moto-x3m.png" />
    <title>Moto X3M Unblocked</title>
    <script type="text/javascript">
        var useEvents = (typeof(Event) === 'function');

        var myDispatchEvent = function (name){
            var event;
            if (useEvents){
                event =  new Event(name);
            }else{
                event = document.createEvent('Event');
                event.initEvent(name, true, true);
            }
            document.getElementById("content").dispatchEvent(event);
        }
        var nape = "nape.mi.js";

        window.famobi_onPauseRequested = function(){
            // code that pauses/mutes the game
            console.log('ad started');
            myDispatchEvent('SDK_GAME_PAUSE');
        };

        window.famobi_onResumeRequested = function(){
            // code that unpauses/unmutes the game
            console.log('ad resumed');
            myDispatchEvent('SDK_GAME_START');
        };

        window.famobi_gameID = 'moto-x3m'; // the actual GAMEID is added to the final version by Famobi
        window.famobi_gameJS = ['js/all.js',
            function() {
                // start the game
                window.famobi_started = true;
                myDispatchEvent('start_game');
            }
        ];
        (function (document, url, fgJS, firstJS) {
            fgJS = document.createElement('script');
            firstJS = document.getElementsByTagName('script')[0];
            fgJS.src = url + encodeURIComponent(document.location.href);
            firstJS.parentNode.insertBefore(fgJS, firstJS);
            })(document, 'js/start.js?e=');
    </script>
</head>

<body>
    <div id="content"></div>
    <div id="orientation">
        <div class="orientation-text">Rotate your device</div>
        <div class="phone-icon"></div>
    </div>
    <div id="loader">Loading ...</div>

<script>
    // Function to check screen orientation and show/hide orientation message
    function checkOrientation() {
        // Check if we're in portrait mode
        if (window.innerHeight > window.innerWidth) {
            // Portrait mode - show orientation message
            document.getElementById('orientation').style.display = 'flex';
        } else {
            // Landscape mode - hide orientation message
            document.getElementById('orientation').style.display = 'none';
        }
    }

    // Check orientation on initial load
    checkOrientation();

    // Check orientation on resize and orientation change
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    
    // Alternative method for detecting orientation change that works on all devices
    window.matchMedia("(orientation: portrait)").addListener(checkOrientation);
    window.matchMedia("(orientation: landscape)").addListener(function() {
        if (!window.matchMedia("(orientation: portrait)").matches) {
            document.getElementById('orientation').style.display = 'none';
        }
    });
</script>
