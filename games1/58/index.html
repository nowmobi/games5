    <style>

        html {height: 100%;}

        * { -webkit-tap-highlight-color:rgba(0,0,0,0); }

        body {
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -khtml-user-select: none;
            margin: 0px 0px 1px 0px; /* the extra 1px allows the iOS inner/outer check to work */
            background: rgb(1, 5, 90);
            height: 100%;
        }

        #content {
            margin: 0 auto;
            position: absolute;
            width: 100%;
            height: 100%;
        }

         #orientation {
            margin: 0 auto;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(0, 0, 0);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .rotate-phone {
            width: 80px;
            height: 160px;
            position: relative;
            background: #333;
            border: 10px solid #555;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin: 50% auto;
        }

        .rotate-phone::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 5px;
            background: #777;
            border-radius: 5px;
        }

        .rotate-phone::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border: 3px solid #777;
            border-radius: 50%;
        }

        .rotate-animation {
            animation: rotatePhone 1.5s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% {
                transform: rotate(0deg);
            }
            10% {
                transform: rotate(0deg);
            }
            30% {
                transform: rotate(90deg);
            }
            40% {
                transform: rotate(90deg);
            }
            60% {
                transform: rotate(180deg);
            }
            70% {
                transform: rotate(180deg);
            }
            90% {
                transform: rotate(270deg);
            }
            100% {
                transform: rotate(270deg);
            }
        }

        @font-face {
            font-family: "Mirza";
            font-style: regular;
            src: url("assets/fonts/Mirza.ttf");
        }

        @font-face {
            font-family: "Jomhuria";
            font-style: regular;
            src: url("assets/fonts/Jomhuria-Regular.ttf");
        }
   
    </style>

</head>

<script>
    function handleScreenOrientation() {
        const orientationDiv = document.getElementById('orientation');
        const isPortrait = window.innerHeight > window.innerWidth;
        
        if (isPortrait) {
            orientationDiv.style.display = 'flex';
        } else {
            orientationDiv.style.display = 'none';
        }
    }

    window.addEventListener('resize', handleScreenOrientation);
    window.addEventListener('orientationchange', handleScreenOrientation);
    document.addEventListener('DOMContentLoaded', handleScreenOrientation);
</script>
